<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/QuizParapendio/quizparapendio.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizParapendio</title>
    <script type="module" crossorigin src="/QuizParapendio/assets/index-BpUT0bnN.js"></script>
    <link rel="stylesheet" crossorigin href="/QuizParapendio/assets/index-DrEgDjkL.css">
    
    <style>
      /* Seleziona la scheda interna di React per azzerare lo spazio vuoto in fondo */
      #root > div, #root > main, #root > section {
        padding-bottom: 0px !important;
        margin-bottom: 0px !important;
      }

      /* Attacca la firma direttamente sotto la riga dei tasti */
      #root::after {
        content: "Quiz Parapendio By Fabio Di Gaetano 🪂";
        display: block;
        text-align: center;
        font-family: sans-serif;
        font-size: 13px;
        color: #555;
        padding-top: 5px;       /* Pochissimo spazio sopra il testo */
        padding-bottom: 15px;    /* Spazio per respirare sotto la firma */
        margin-top: -10px;       /* Tira su il testo per colmare il vuoto */
        background-color: #f3f4f6; /* Colore grigio identico alla barra dei tasti */
        border-radius: 0 0 8px 8px; /* Chiude gli angoli tondi del quiz */
        width: 100%;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
